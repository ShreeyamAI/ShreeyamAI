<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 520 520" role="img" aria-label="Shreeyam's portrait in an animated neon frame">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="crop"><circle cx="260" cy="260" r="190"/></clipPath>
  </defs>
  <circle cx="260" cy="260" r="228" fill="#050816" stroke="#13233b" stroke-width="2"/>
  <circle cx="260" cy="260" r="211" fill="none" stroke="url(#neon)" stroke-width="5" stroke-dasharray="205 65 52 95" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 260 260" to="360 260 260" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="260" r="202" fill="none" stroke="#a855f7" stroke-opacity=".8" stroke-width="2" stroke-dasharray="18 38">
    <animateTransform attributeName="transform" type="rotate" from="360 260 260" to="0 260 260" dur="14s" repeatCount="indefinite"/>
  </circle>
  <image x="70" y="70" width="380" height="380" preserveAspectRatio="xMidYMid slice" clip-path="url(#crop)" xlink:href="https://raw.githubusercontent.com/ShreeyamAI/ShreeyamAI/main/assets/shreeyam-neon-portrait.png"/>
  <circle cx="260" cy="260" r="190" fill="none" stroke="url(#neon)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="260" cy="49" r="6" fill="#67e8f9" filter="url(#glow)"><animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/></circle>
</svg>
